<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="315" r="400" fill="url(#glow)"/>

  <!-- Orbits -->
  <circle cx="600" cy="315" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4,8"/>
  <circle cx="600" cy="315" r="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6,12"/>
  <circle cx="600" cy="315" r="290" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Brand Signature Three Circles -->
  <g transform="translate(600, 200)">
    <circle cx="-55" cy="0" r="20" fill="#ffffff"/>
    <circle cx="0" cy="0" r="20" fill="#ffffff"/>
    <circle cx="55" cy="0" r="20" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="44" font-weight="300" letter-spacing="8" fill="#ffffff">
    THE HOUSE OF FUTURE
  </text>

  <text x="600" y="370" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" letter-spacing="6" fill="#888888">
    AN AI ECOSYSTEM // 4 RINGS OF INTELLIGENCE
  </text>

  <!-- Four Rings Summary at Bottom -->
  <g transform="translate(600, 480)">
    <text x="-360" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#aaaaaa">
      01 // ECOSYSTEM &amp; DEV
    </text>
    <text x="-120" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#aaaaaa">
      02 // PHILOSOPHY &amp; ART
    </text>
    <text x="120" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#aaaaaa">
      03 // EDUCATION &amp; IDEAS
    </text>
    <text x="360" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#aaaaaa">
      04 // MEDIA &amp; PUBLISHING
    </text>
  </g>

  <!-- Coordinates & Hash -->
  <text x="60" y="580" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="3" fill="#555555">
    LAT 34°03'N LON 118°14'W // THE GENESIS POINT
  </text>
  <text x="1140" y="580" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="3" fill="#555555">
    CONTINUOUS STORYTELLING EXPERIENCE
  </text>
</svg>
